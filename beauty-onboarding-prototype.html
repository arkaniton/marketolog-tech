<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карты · Салон «Ирис» · МаркетологТЕХ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{beauty:{ink:'#171816',muted:'#5d6159',faint:'#91958c',canvas:'#f5f1e8',surface:'#fffdf8',soft:'#f1ece2',accent:'#e36d52','accent-strong':'#a34431','accent-soft':'#efd6ce',sage:'#8da86d','sage-soft':'#e3ecd7',warning:'#a86b23','warning-soft':'#f4e6cf',sidebar:'#252822'}},fontFamily:{beauty:['Onest','Golos Text','ui-sans-serif','system-ui'],'beauty-display':['Golos Text','Onest','sans-serif']},boxShadow:{beauty:'0 10px 28px rgba(35,31,26,.055)'}}}};
  </script>
  <style>
    :root{--ink:#171816;--muted:#5d6159;--faint:#91958c;--canvas:#f5f1e8;--surface:#fffdf8;--soft:#f1ece2;--line:rgba(23,24,22,.12);--accent:#e36d52;--focus:#ba432f;--sidebar:#252822}
    *{box-sizing:border-box} html,body{min-width:320px;min-height:100%;margin:0} body{overflow:hidden;background:var(--canvas);color:var(--ink);font-family:Onest,"Golos Text",sans-serif;-webkit-font-smoothing:antialiased} button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    .app-shell{display:grid;height:calc(100dvh - 30px);grid-template-columns:216px minmax(0,1fr)}.sidebar{display:flex;min-height:0;flex-direction:column;overflow-y:auto;background:var(--sidebar);color:#fff;padding:14px 12px}.side-link{display:grid;min-height:43px;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:8px;border-radius:10px;padding:0 10px;color:rgba(255,255,255,.62);font-size:12px;font-weight:650;text-align:left}.side-link.is-active{background:#fff;color:var(--ink);box-shadow:0 8px 22px rgba(28,27,23,.06)}.nav-icon{display:grid;width:24px;height:24px;place-items:center;border-radius:7px;background:rgba(255,255,255,.07)}.side-link.is-active .nav-icon{background:var(--ink);color:#fff}
    .map-main{min-width:0;height:calc(100dvh - 30px);overflow-y:auto;scrollbar-color:rgba(23,24,22,.25) transparent;scrollbar-width:thin}.map-main::-webkit-scrollbar{width:7px}.map-main::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(23,24,22,.2)}.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 10px 28px rgba(35,31,26,.055)}
    .tab{position:relative;border-radius:9px;padding:8px 10px;color:var(--faint);font-size:11px;font-weight:700}.tab:hover{background:var(--soft);color:var(--ink)}.tab.is-active{color:var(--ink)}.tab.is-active:after{position:absolute;right:10px;bottom:0;left:10px;height:2px;border-radius:999px;background:var(--accent);content:""}.mini-tab{border-radius:8px;padding:7px 10px;color:var(--muted);font-size:10px;font-weight:700}.mini-tab:hover{background:var(--soft);color:var(--ink)}.mini-tab.is-active{background:var(--ink);color:#fff}.field{min-height:40px;width:100%;border:1px solid rgba(23,24,22,.24);border-radius:12px;background:var(--surface);padding:9px 11px;color:var(--ink);font-size:11px;outline:0}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(227,109,82,.18)}.review-row.is-active{border-color:rgba(227,109,82,.45);background:#efd6ce}
    .toast{pointer-events:none;position:fixed;right:20px;bottom:20px;z-index:60;transform:translateY(16px);border-radius:12px;background:var(--ink);padding:11px 14px;color:#fff;font-size:11px;font-weight:650;opacity:0;transition:transform 180ms,opacity 180ms}.toast.is-visible{transform:translateY(0);opacity:1}.ref-thumb{background:linear-gradient(135deg,#d8bcae,#ead7c9)}.ref-thumb:nth-child(2n){background:linear-gradient(135deg,#c4d0b6,#e0e9d6)}.ref-thumb:nth-child(3n){background:linear-gradient(135deg,#d7c6ae,#f0e5d6)}
    @media(max-width:900px){.app-shell{grid-template-columns:70px minmax(0,1fr)}.sidebar-copy,.workspace-box,.sidebar-label,.sidebar-footer,.side-link span:not(.nav-icon){display:none}.side-link{grid-template-columns:1fr;justify-items:center;padding:0}}@media(max-width:680px){body{overflow:auto}.app-shell{display:block;height:auto}.sidebar{position:sticky;top:0;z-index:30;display:flex;height:58px;min-height:58px;flex-direction:row;align-items:center;gap:4px;overflow-x:auto;padding:8px}.sidebar-brand{flex:0 0 40px}.sidebar nav{display:flex!important;gap:3px}.side-link{width:42px;min-width:42px;min-height:40px}.map-main{height:auto;min-height:calc(100dvh - 88px);overflow:visible}.review-layout{grid-template-columns:1fr!important}.review-list{max-height:210px;overflow-y:auto}.form-grid{grid-template-columns:1fr!important}.sidebar-footer{display:none}}
  </style>
</head>
<body>
  <svg class="hidden" aria-hidden="true">
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M12 21s7-4.35 7-11a7 7 0 1 0-14 0c0 6.65 7 11 7 11Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M5 18.5 3.5 21l.7-4.2A8 8 0 1 1 5 18.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 5h13v14H4zM17 8h3v9a2 2 0 0 1-2 2h-1M7 9h7M7 13h7M7 16h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="9" r="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m4 17 4.5-4.5 3.2 3.2 2.3-2.3 6 5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  </svg>
  <div class="flex h-[30px] items-center justify-between bg-beauty-ink px-5 text-[9px] font-semibold text-white/55"><span class="inline-flex items-center gap-2"><i class="h-1.5 w-1.5 rounded-full bg-beauty-sage"></i> Демо кабинета · Карты</span><span class="hidden sm:block">Публикации не отправляются</span></div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <div class="sidebar-brand flex items-center gap-2 px-1 py-2"><span class="grid h-9 w-9 place-items-center rounded-[11px] bg-beauty-surface font-beauty-display text-[16px] font-bold text-beauty-ink">М</span><span class="sidebar-copy font-beauty-display text-[13px] font-bold tracking-[-.045em]">Маркетолог<span class="text-beauty-accent">ТЕХ</span><small class="mt-0.5 block font-beauty text-[8px] font-medium tracking-normal text-white/35">кабинет салона</small></span></div>
      <div class="workspace-box mt-4 rounded-[14px] border border-white/10 bg-white/[.035] p-3"><small class="text-[8px] font-bold uppercase tracking-[.11em] text-white/35">Рабочее пространство</small><strong class="mt-2 block truncate text-[12px]">Салон «Ирис»</strong><span class="mt-1 block text-[8px] text-white/35">Москва · Хамовники</span></div>
      <nav class="mt-5 grid gap-1" aria-label="Разделы"><p class="sidebar-label mb-1 px-2 text-[8px] font-bold uppercase tracking-[.12em] text-white/30">Работа</p><button class="side-link is-active" type="button"><span class="nav-icon"><svg class="h-4 w-4"><use href="#i-map"/></svg></span><span>Карты</span></button></nav>
      <div class="sidebar-footer mt-auto border-t border-white/10 px-2 pt-4 text-[8px] leading-relaxed text-white/35"><span class="inline-flex items-center gap-1.5 font-semibold text-white/75"><i class="h-1.5 w-1.5 rounded-full bg-beauty-sage"></i> Данные обновлены сегодня</span></div>
    </aside>
    <main class="map-main bg-beauty-canvas" id="mainContent" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const icon=(name,cls='h-4 w-4')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const primary='inline-flex h-8 items-center justify-center gap-1.5 rounded-[10px] bg-beauty-ink px-3 text-[11px] font-bold text-white transition-all duration-200 hover:-translate-y-px hover:bg-[#30332e] active:scale-[.98]';
    const secondary='inline-flex h-8 items-center justify-center gap-1.5 rounded-[10px] border border-black/10 bg-beauty-surface px-3 text-[11px] font-bold text-beauty-ink transition-colors hover:bg-beauty-soft active:scale-[.98]';
    const reviews=[
      {id:'olga',name:'Ольга В.',source:'2ГИС',stars:'3',date:'Сегодня',text:'Стрижка хорошая, но мастера ждала 25 минут. В остальном всё понравилось.',draft:'Ольга, спасибо, что рассказали об ожидании. Нам жаль, что визит начался не вовремя. Мы уже сверяем расписание, чтобы такие задержки не повторялись.',topics:['ожидание','стрижка']},
      {id:'vera',name:'Вера П.',source:'Яндекс Карты',stars:'5',date:'Вчера',text:'Очень внимательный мастер Мария, цвет получился именно таким, как хотела.',draft:'Вера, спасибо за тёплый отзыв! Передадим Марии ваши слова. Будем рады видеть вас снова.',topics:['мастер Мария','окрашивание']},
      {id:'nina',name:'Нина С.',source:'Яндекс Карты',stars:'4',date:'12 авг',text:'Красиво и чисто, но сложно было найти вход со двора.',draft:'Нина, благодарим за обратную связь. Уже уточняем описание входа, чтобы найти нас было проще.',topics:['вход','навигация']}
    ];
    const state={tab:'reviews',review:'olga',reviewFilter:'open',answered:[],contentTab:'publications',kind:'story',editingId:null,keywords:{story:['окрашивание','уход для волос','мастер Мария','Хамовники'],news:['свободные окна','стрижка','мастер Мария','салон в Хамовниках']},files:[],materials:[{id:'story-1',kind:'story',title:'Уход после окрашивания',status:'Черновик',meta:'4 слайда'},{id:'news-1',kind:'news',title:'Свободные окна на этой неделе',status:'Готово к публикации',meta:'новость и обложка'},{id:'story-2',kind:'story',title:'Летний уход для волос',status:'Готово к публикации',meta:'3 слайда'},{id:'news-2',kind:'news',title:'Подарочный сертификат',status:'Готово к публикации',meta:'новость и обложка'}]};
    const main=document.getElementById('mainContent'),toast=document.getElementById('toast');let toastTimer;
    const showToast=message=>{toast.textContent=message;toast.classList.add('is-visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),2300)};
    function header(){const isContent=state.tab==='content';return `<div class="mx-auto w-full max-w-[1100px] px-2.5 pb-2 pt-3 sm:px-4"><div class="card overflow-hidden"><section class="flex flex-wrap items-center justify-between gap-3 px-3.5 py-3"><div class="flex min-w-0 items-center gap-3"><span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-beauty-soft text-beauty-accent-strong">${icon('map','h-5 w-5')}</span><div class="min-w-0"><p class="font-beauty-display text-[17px] font-bold tracking-[-.045em]">Карты</p><p class="mt-1 text-[10px] font-medium text-beauty-muted">Салон «Ирис» · Яндекс Карты и 2ГИС</p></div></div><button class="${primary}" data-tab="content" data-content-tab="create" type="button">${icon('plus','h-3.5 w-3.5')} Создать</button></section><nav class="flex overflow-x-auto border-t border-black/10 px-2" aria-label="Разделы Карт"><button class="tab ${!isContent?'is-active':''}" data-tab="reviews" type="button">Отзывы <span class="ml-1 rounded-full bg-beauty-warning-soft px-1.5 py-0.5 text-[8px] text-beauty-warning">${reviews.length-state.answered.length}</span></button><button class="tab ${isContent?'is-active':''}" data-tab="content" type="button">Контент</button></nav></div></div>`}
    function reviewsView(){const visible=state.reviewFilter==='open'?reviews.filter(r=>!state.answered.includes(r.id)):reviews;const current=reviews.find(r=>r.id===state.review)||visible[0]||reviews[0];return `<section class="mx-auto grid w-full max-w-[1100px] gap-3 px-2.5 pb-4 sm:px-4"><h1 class="font-beauty-display text-[clamp(1.35rem,2.2vw,1.85rem)] font-bold tracking-[-.05em]">Отзывы</h1><section class="review-layout card grid min-h-[490px] overflow-hidden lg:grid-cols-[290px_minmax(0,1fr)]"><aside class="review-list border-b border-black/10 lg:border-b-0 lg:border-r"><div class="flex items-center justify-between border-b border-black/10 p-3"><h2 class="text-[12px] font-bold">Входящие</h2><div class="flex rounded-lg bg-beauty-soft p-0.5"><button class="mini-tab ${state.reviewFilter==='open'?'is-active':''}" data-review-filter="open" type="button">Без ответа</button><button class="mini-tab ${state.reviewFilter==='all'?'is-active':''}" data-review-filter="all" type="button">Все</button></div></div><div class="grid gap-1 p-2">${visible.map(r=>`<button class="review-row ${r.id===current.id?'is-active':''} rounded-xl border border-transparent p-2.5 text-left hover:bg-beauty-soft" data-review="${r.id}" type="button"><span class="flex items-center justify-between gap-2"><b class="text-[11px]">${r.name}</b><span class="text-[9px] font-bold ${Number(r.stars)<4?'text-beauty-accent-strong':'text-beauty-muted'}">${r.stars} ★</span></span><p class="mt-1.5 line-clamp-2 text-[9px] leading-relaxed text-beauty-muted">${r.text}</p><small class="mt-2 block text-[8px] text-beauty-faint">${r.source} · ${r.date}</small></button>`).join('')||'<p class="p-3 text-[10px] text-beauty-muted">Все новые отзывы обработаны.</p>'}</div></aside><article class="min-w-0 p-3.5 sm:p-4"><p class="text-[9px] font-extrabold uppercase tracking-[.1em] text-beauty-accent-strong">${current.source} · ${current.date}</p><div class="mt-1 flex flex-wrap items-center justify-between gap-3"><h2 class="font-beauty-display text-[20px] font-bold tracking-[-.05em]">${current.name} <span class="text-beauty-accent-strong">${current.stars} ★</span></h2><div class="flex flex-wrap gap-1.5">${current.topics.map(topic=>`<span class="rounded-full bg-beauty-soft px-2 py-1 text-[8px] font-bold text-beauty-muted">${topic}</span>`).join('')}</div></div><blockquote class="mt-4 rounded-xl bg-beauty-soft p-3 text-[11px] leading-relaxed text-beauty-muted">«${current.text}»</blockquote><div class="mt-4 flex flex-wrap items-center justify-between gap-2"><label class="text-[10px] font-bold" for="replyDraft">Ответ</label><div class="flex rounded-lg bg-beauty-soft p-0.5"><button class="mini-tab is-active" data-rephrase="calm" type="button">Спокойно</button><button class="mini-tab" data-rephrase="warm" type="button">Теплее</button><button class="mini-tab" data-rephrase="short" type="button">Короче</button></div></div><textarea class="field mt-2 min-h-[154px] resize-y leading-relaxed" id="replyDraft">${current.draft}</textarea><div class="mt-4 flex flex-wrap justify-between gap-2 border-t border-black/10 pt-3"><button class="${secondary}" data-copy type="button">${icon('copy','h-3.5 w-3.5')} Скопировать</button><button class="${primary}" data-answer="${current.id}" type="button">Отметить отвеченным ${icon('check','h-3.5 w-3.5')}</button></div></article></section></section>`}
    function keywordChips(){const values=state.keywords[state.kind];return `<div class="mt-2 flex flex-wrap gap-1.5">${values.map((value,index)=>`<button class="inline-flex min-h-7 items-center gap-1 rounded-full border border-black/10 bg-beauty-surface px-2 text-[9px] font-semibold text-beauty-muted hover:border-beauty-accent" data-remove-keyword="${index}" type="button">${value}<span class="text-beauty-faint">×</span></button>`).join('')}<span class="inline-flex min-h-7 items-center rounded-full border border-dashed border-black/20 bg-beauty-surface px-2"><input class="w-20 bg-transparent text-[9px] outline-none" id="newKeyword" placeholder="Добавить" aria-label="Новое ключевое слово"><button class="ml-1 text-[12px] leading-none text-beauty-accent-strong" data-add-keyword type="button">+</button></span></div>`}
    function refs(){return `<section><div class="flex flex-wrap items-center justify-between gap-2"><div><b class="text-[10px]">Фото-референсы</b><p class="mt-0.5 text-[8px] text-beauty-faint">Необязательно · ИИ учтёт их при генерации</p></div><label class="${secondary} cursor-pointer">${icon('image','h-3.5 w-3.5')} Добавить референс<input class="sr-only" id="referenceFiles" type="file" accept="image/*" multiple></label></div>${state.files.length?`<div class="mt-3 flex flex-wrap gap-2">${state.files.map((file,index)=>`<div class="relative h-16 w-16 overflow-hidden rounded-xl border border-black/10 bg-beauty-soft">${file.url?`<img class="h-full w-full object-cover" src="${file.url}" alt="${file.name}">`:'<i class="ref-thumb block h-full w-full"></i>'}<button class="absolute right-1 top-1 grid h-5 w-5 place-items-center rounded-full bg-beauty-ink text-white" data-remove-ref="${index}" aria-label="Удалить ${file.name}" type="button">×</button></div>`).join('')}</div>`:''}</section>`}
    function creator(){const isStory=state.kind==='story';const editing=state.materials.find(item=>item.id===state.editingId);const title=editing?.title||(isStory?'Уход после окрашивания':'Свободные окна на этой неделе');const facts=isStory?'Покажите результат окрашивания, во втором кадре — короткий совет по уходу. В конце предложите записаться.':'Во вторник и четверг появились свободные окна у Марии. Запись — через Карты или по телефону салона.';return `<form class="p-3 sm:p-4" id="contentForm"><div class="flex gap-2 rounded-xl bg-beauty-soft p-1"><button class="mini-tab flex-1 ${isStory?'is-active':''}" data-kind="story" type="button">${icon('image','h-3.5 w-3.5')} История</button><button class="mini-tab flex-1 ${!isStory?'is-active':''}" data-kind="news" type="button">${icon('news','h-3.5 w-3.5')} Новость</button></div><div class="form-grid mt-4 grid gap-4 lg:grid-cols-[minmax(0,1fr)_300px]"><div class="grid content-start gap-4"><label class="text-[10px] font-bold">${isStory?'Название':'Заголовок'}<input class="field mt-1.5" name="title" value="${title}" required></label><label class="text-[10px] font-bold">Ключевые факты<textarea class="field mt-1.5 min-h-[150px] resize-y" name="facts" required>${facts}</textarea></label><section><div class="flex items-center justify-between"><b class="text-[10px]">Ключевые слова</b><span class="text-[8px] text-beauty-faint">Собраны автоматически</span></div>${keywordChips()}</section>${isStory?'<div class="grid gap-3 sm:grid-cols-2"><label class="text-[10px] font-bold">Слайдов<select class="field mt-1.5" name="slides"><option>4</option><option>3</option><option>5</option></select></label><label class="text-[10px] font-bold">Кнопка<select class="field mt-1.5" name="cta"><option>Записаться</option><option>Подробнее</option><option>Позвонить</option></select></label></div>':''}</div><aside class="rounded-xl bg-beauty-soft p-3">${refs()}<div class="mt-4 rounded-xl bg-beauty-surface p-3"><div class="flex items-center justify-between gap-2"><b class="text-[10px]">Генерация</b><span class="text-[8px] font-bold text-beauty-accent-strong">${isStory?'GPT Image 2':'Nano Banana 2'}</span></div><p class="mt-2 text-[9px] leading-relaxed text-beauty-muted">${isStory?'ИИ соберёт визуальную историю из 3–5 слайдов.':'ИИ подготовит текст и обложку новости.'}</p></div></aside></div><div class="mt-4 flex justify-end border-t border-black/10 pt-3"><button class="${primary}" type="submit">Собрать ${isStory?'историю':'новость'} ${icon('arrow','h-3.5 w-3.5')}</button></div></form>`}
    function publicationRow(item){const ready=item.status==='Готово к публикации';return `<article class="grid grid-cols-[44px_minmax(0,1fr)_auto] items-center gap-3 px-3 py-3 ${ready?'':'border-t border-black/10'}"><div class="h-11 w-11 overflow-hidden rounded-[10px] bg-beauty-soft">${item.kind==='story'?`<div class="grid h-full grid-cols-2 gap-0.5 p-1"><i class="ref-thumb rounded"></i><i class="ref-thumb rounded"></i><i class="ref-thumb rounded"></i><i class="ref-thumb rounded"></i></div>`:'<i class="block h-full bg-[#d7c2b0]"></i>'}</div><div class="min-w-0"><b class="block truncate text-[11px]">${item.title}</b><small class="mt-1 block text-[8px] text-beauty-muted">${item.kind==='story'?'История':'Новость'} · ${item.meta}</small></div><div class="flex shrink-0 items-center gap-2"><span class="hidden rounded-full ${ready?'bg-beauty-sage-soft text-[#587147]':'bg-beauty-warning-soft text-beauty-warning'} px-2 py-1 text-[8px] font-bold sm:inline">${item.status}</span><button class="text-[10px] font-bold text-beauty-accent-strong" data-open-material="${item.id}" type="button">Открыть</button></div></article>`}
    function publications(){const ready=state.materials.filter(item=>item.status==='Готово к публикации'),drafts=state.materials.filter(item=>item.status!=='Готово к публикации');return `<div><div class="flex items-center justify-between border-b border-black/10 px-3 py-3"><h2 class="text-[12px] font-bold">К публикации</h2><span class="rounded-full bg-beauty-sage-soft px-2 py-1 text-[8px] font-bold text-[#587147]">${ready.length}</span></div>${ready.length?ready.map(publicationRow).join(''):'<p class="px-3 py-5 text-[10px] text-beauty-muted">Готовых публикаций пока нет.</p>'}${drafts.length?`<div class="border-t border-black/10 px-3 py-2.5 text-[9px] font-extrabold uppercase tracking-[.1em] text-beauty-faint">Черновики</div>${drafts.map(publicationRow).join('')}`:''}</div>`}
    function contentView(){const creating=state.contentTab==='create';return `<section class="mx-auto grid w-full max-w-[1100px] gap-3 px-2.5 pb-4 sm:px-4"><h1 class="font-beauty-display text-[clamp(1.35rem,2.2vw,1.85rem)] font-bold tracking-[-.05em]">Контент</h1><section class="card overflow-hidden"><nav class="flex border-b border-black/10 px-2"><button class="tab ${!creating?'is-active':''}" data-content-tab="publications" type="button">К публикации <span class="ml-1 rounded-full bg-beauty-sage-soft px-1.5 py-0.5 text-[8px] text-[#587147]">${state.materials.filter(item=>item.status==='Готово к публикации').length}</span></button><button class="tab ${creating?'is-active':''}" data-content-tab="create" type="button">Создать</button></nav>${creating?creator():publications()}</section></section>`}
    function render(){const content=state.tab==='content';main.innerHTML=header()+(content?contentView():reviewsView());document.title=`${content?'Контент':'Отзывы'} · Карты · МаркетологТЕХ`;history.replaceState(null,'',`#maps-${content?'content':'reviews'}`)}
    function resetContentScroll(){main.scrollTop=0}
    document.addEventListener('click',event=>{const tab=event.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;if(tab.dataset.contentTab){state.contentTab=tab.dataset.contentTab;state.editingId=null}else if(tab.dataset.tab==='content'){state.contentTab='publications';state.editingId=null}render();resetContentScroll();return}const review=event.target.closest('[data-review]');if(review){state.review=review.dataset.review;render();return}const filter=event.target.closest('[data-review-filter]');if(filter){state.reviewFilter=filter.dataset.reviewFilter;render();return}const answer=event.target.closest('[data-answer]');if(answer){state.answered.push(answer.dataset.answer);state.reviewFilter='open';render();showToast('Отзыв отмечен отвеченным');return}if(event.target.closest('[data-copy]')){showToast('Ответ скопирован');return}const tone=event.target.closest('[data-rephrase]');if(tone){document.querySelectorAll('[data-rephrase]').forEach(button=>button.classList.toggle('is-active',button===tone));showToast('Вариант обновлён');return}const contentTab=event.target.closest('[data-content-tab]');if(contentTab){state.contentTab=contentTab.dataset.contentTab;render();resetContentScroll();return}const kind=event.target.closest('[data-kind]');if(kind){state.kind=kind.dataset.kind;state.editingId=null;state.files=[];render();return}const removeKeyword=event.target.closest('[data-remove-keyword]');if(removeKeyword){state.keywords[state.kind].splice(Number(removeKeyword.dataset.removeKeyword),1);render();return}if(event.target.closest('[data-add-keyword]')){const input=document.getElementById('newKeyword'),value=input.value.trim();if(value){state.keywords[state.kind].push(value);render()}return}const removeRef=event.target.closest('[data-remove-ref]');if(removeRef){state.files.splice(Number(removeRef.dataset.removeRef),1);render();return}const item=event.target.closest('[data-open-material]');if(item){const material=state.materials.find(x=>x.id===item.dataset.openMaterial);state.kind=material.kind;state.editingId=material.id;state.contentTab='create';state.files=[];render();resetContentScroll()}});
    document.addEventListener('change',event=>{if(event.target.id==='referenceFiles'){state.files=[...event.target.files].slice(0,14).map(file=>({name:file.name,url:URL.createObjectURL(file)}));render();showToast(state.files.length?`Добавлено фото: ${state.files.length}`:'')}});
    document.addEventListener('submit',event=>{if(event.target.id!=='contentForm')return;event.preventDefault();const form=new FormData(event.target),kind=state.kind,title=form.get('title').trim();state.materials.unshift({id:`${kind}-${Date.now()}`,kind,title,status:'Готово к публикации',meta:kind==='story'?`${form.get('slides')} слайда`:'новость и обложка'});state.editingId=null;state.contentTab='publications';state.files=[];render();showToast(kind==='story'?'История собрана':'Новость собрана')});
    const initial=(location.hash.match(/maps-(reviews|content)/)||[])[1]||'reviews';state.tab=initial;render();
  </script>
</body>
</html>
