<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карты → Контент · AI-сценарий · МаркетологТЕХ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{beauty:{ink:'#171816',muted:'#5d6159',faint:'#91958c',canvas:'#f5f1e8',surface:'#fffdf8',soft:'#f1ece2',accent:'#e36d52','accent-strong':'#a34431','accent-soft':'#efd6ce',sage:'#8da86d','sage-soft':'#e3ecd7',warning:'#a86b23','warning-soft':'#f4e6cf',sidebar:'#252822'}},fontFamily:{beauty:['Onest','Golos Text','ui-sans-serif','system-ui'],'beauty-display':['Golos Text','Onest','sans-serif']},boxShadow:{beauty:'0 10px 28px rgba(35,31,26,.055)'}}}};
  </script>
  <style>
    :root{--ink:#171816;--muted:#5d6159;--faint:#91958c;--canvas:#f5f1e8;--surface:#fffdf8;--soft:#f1ece2;--line:rgba(23,24,22,.12);--accent:#e36d52;--focus:#ba432f;--sidebar:#252822}*{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}body{background:var(--canvas);color:var(--ink);font-family:Onest,"Golos Text",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.shell{display:grid;min-height:100dvh;grid-template-columns:216px minmax(0,1fr)}.sidebar{display:flex;min-height:0;flex-direction:column;background:var(--sidebar);padding:14px 12px;color:#fff}.side-link{display:grid;min-height:43px;grid-template-columns:24px 1fr;align-items:center;gap:8px;border-radius:10px;padding:0 10px;color:rgba(255,255,255,.62);font-size:12px;font-weight:650;text-align:left}.side-link.is-active{background:#fff;color:var(--ink)}.nav-icon{display:grid;height:24px;width:24px;place-items:center;border-radius:7px;background:rgba(255,255,255,.07)}.side-link.is-active .nav-icon{background:var(--ink);color:#fff}.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 10px 28px rgba(35,31,26,.055)}.tab{position:relative;border-radius:9px;padding:9px 10px;color:var(--faint);font-size:11px;font-weight:700}.tab:hover{background:var(--soft);color:var(--ink)}.tab.is-active{color:var(--ink)}.tab.is-active:after{position:absolute;right:10px;bottom:0;left:10px;height:2px;border-radius:999px;background:var(--accent);content:""}.field{min-height:40px;width:100%;border:1px solid rgba(23,24,22,.24);border-radius:12px;background:var(--surface);padding:9px 11px;color:var(--ink);font-size:11px;outline:0}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(227,109,82,.18)}.goal-card{min-height:132px;transition:border-color .18s,background .18s,transform .18s}.goal-card:hover{border-color:rgba(227,109,82,.62);background:#fffaf5;transform:translateY(-1px)}.chip{border:1px solid rgba(23,24,22,.12);border-radius:999px;background:var(--surface);padding:8px 10px;color:var(--muted);font-size:10px;font-weight:700}.chip.is-active{border-color:var(--ink);background:var(--ink);color:#fff}.progress-step{display:flex;align-items:center;gap:7px;color:var(--faint);font-size:10px;font-weight:750}.progress-step b{display:grid;height:21px;width:21px;place-items:center;border-radius:999px;background:var(--soft);font-size:9px}.progress-step.is-active{color:var(--ink)}.progress-step.is-active b{background:var(--accent);color:#fff}.progress-step.is-done b{background:#e3ecd7;color:#587147}.toast{pointer-events:none;position:fixed;right:20px;bottom:20px;z-index:60;transform:translateY(16px);border-radius:12px;background:var(--ink);padding:11px 14px;color:#fff;font-size:11px;font-weight:650;opacity:0;transition:transform .18s,opacity .18s}.toast.is-visible{transform:translateY(0);opacity:1}.preview-image{background:linear-gradient(135deg,#c9b2a1,#e9d8cb 45%,#93a979)}.preview-image.is-work{background:linear-gradient(135deg,#513e32,#cc896e 48%,#f2c5a8)}.upload-zone{border:1px dashed rgba(23,24,22,.26);border-radius:14px;background:var(--soft);transition:border-color .18s,background .18s}.upload-zone:hover{border-color:var(--accent);background:#fffaf5}@media(max-width:900px){.shell{grid-template-columns:70px minmax(0,1fr)}.sidebar-copy,.workspace,.side-copy{display:none}.side-link{grid-template-columns:1fr;justify-items:center;padding:0}}@media(max-width:680px){.shell{display:block}.sidebar{position:sticky;top:0;z-index:20;display:flex;height:58px;min-height:58px;flex-direction:row;align-items:center;padding:8px}.sidebar nav{display:flex!important}.side-link{width:42px;min-width:42px}.preview{position:static!important}.desktop-only{display:none!important}}
  </style>
</head>
<body>
  <svg class="hidden" aria-hidden="true"><symbol id="i-map" viewBox="0 0 24 24"><path d="M12 21s7-4.35 7-11a7 7 0 1 0-14 0c0 6.65 7 11 7 11Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="9" r="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m4 17 4.5-4.5 3.2 3.2 2.3-2.3 6 5.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16.5-.6 4.1 4.1-.6L19 8.5 15.5 5zM13.5 7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol></svg>
  <div class="shell"><aside class="sidebar"><div class="flex items-center gap-2 px-1 py-2"><span class="grid h-9 w-9 place-items-center rounded-[11px] bg-beauty-surface font-beauty-display text-[16px] font-bold text-beauty-ink">М</span><span class="sidebar-copy font-beauty-display text-[13px] font-bold">Маркетолог<span class="text-beauty-accent">ТЕХ</span><small class="mt-0.5 block font-beauty text-[8px] font-medium text-white/35">кабинет салона</small></span></div><div class="workspace mt-4 rounded-[14px] border border-white/10 bg-white/[.035] p-3"><small class="text-[8px] font-bold uppercase tracking-[.11em] text-white/35">Рабочее пространство</small><strong class="mt-2 block text-[12px]">Салон «Ирис»</strong><span class="mt-1 block text-[8px] text-white/35">Москва · Хамовники</span></div><nav class="mt-5 grid gap-1"><button class="side-link is-active" type="button"><span class="nav-icon"><svg class="h-4 w-4"><use href="#i-map"/></svg></span><span class="side-copy">Карты</span></button></nav><p class="sidebar-copy mt-auto border-t border-white/10 px-2 pt-4 text-[8px] text-white/35">Демо нового сценария · отдельно от текущего макета</p></aside><main class="min-w-0" id="app"></main></div><div class="toast" id="toast" role="status"></div>
  <script>
    const icon=(name,cls='h-4 w-4')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const primary='inline-flex h-9 items-center justify-center gap-1.5 rounded-[10px] bg-beauty-ink px-3 text-[11px] font-bold text-white transition-all hover:-translate-y-px hover:bg-[#30332e] active:scale-[.98]';
    const secondary='inline-flex h-9 items-center justify-center gap-1.5 rounded-[10px] border border-black/10 bg-beauty-surface px-3 text-[11px] font-bold text-beauty-ink transition-colors hover:bg-beauty-soft active:scale-[.98]';
    const goals={slots:{title:'Заполнить свободные окна',note:'Привлечём записи на ближайшие дни',icon:'⏱'},service:{title:'Продвинуть услугу',note:'Расскажем о конкретной услуге салона',icon:'✦'},work:{title:'Показать работу',note:'Сделаем публикацию из фото результата',icon:'◐'},promo:{title:'Рассказать об акции',note:'Скидка, специальное предложение или бонус',icon:'%'} ,news:{title:'Новость салона',note:'Мастер, событие, изменения или атмосфера',icon:'●'},suggest:{title:'Предложить мне',note:'AI сам выберет подходящую тему',icon:'✦'}};
    const services=['Маникюр','Педикюр','Окрашивание','Стрижка','Уход за волосами','Брови и ресницы','Макияж','Укладка'];
    const recommendations=[{goal:'service',title:'Есть идея для публикации',body:'Последняя новость выходила 12 дней назад. Можно напомнить клиентам про окрашивание и показать свежую работу.'},{goal:'slots',title:'Пора заполнить окна',body:'На этой неделе у мастера Анны есть свободные записи. Короткая новость поможет быстро их занять.'},{goal:'work',title:'Покажите свежую работу',body:'В карточке давно не было фото результата. История с новой работой оживит профиль.'}];
    const suggestions=[{goal:'service',title:'Предлагаем рассказать про окрашивание',body:'Вы давно не публиковали новости об этой услуге, а в профиле уже есть подходящие фотографии работ.'},{goal:'slots',title:'Предлагаем заполнить окна на этой неделе',body:'В расписании есть свободные места, а клиенты чаще записываются, когда видят понятный повод.'},{goal:'work',title:'Предлагаем показать работу мастера Анны',body:'Свежий результат лучше всего работает как история — фотография уже скажет главное.'}];
    const state={tab:'overview',view:'overview',step:1,goal:'slots',recommendation:0,suggestion:0,preview:'story',period:'На этой неделе',date:'',selectedServices:['Окрашивание'],accent:'Рассказать об услуге',note:'',promo:'Скидка 15% на первое посещение',endDate:'',noEnd:false,photos:[],showMore:false,advanced:false,result:{title:'Свободные окна у мастера Анны',text:'На этой неделе у мастера Анны появились свободные окна на окрашивание. Если давно хотели освежить цвет — выберите удобное время в записи.',cta:'Записаться'},drafts:[{id:'d1',goal:'slots',title:'Окрашивание · Свободные окна',type:'История',date:'Сегодня, 10:45',status:'Черновик'},{id:'d2',goal:'promo',title:'Маникюр · Скидка 15%',type:'Новость',date:'Вчера, 15:20',status:'Черновик'},{id:'d3',goal:'news',title:'Новый мастер в нашей команде',type:'Новость',date:'3 дня назад',status:'Опубликовано'}]};
    const app=document.getElementById('app'),toast=document.getElementById('toast');let toastTimer;
    const esc=value=>String(value).replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    const notify=message=>{toast.textContent=message;toast.classList.add('is-visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),2200)};
    function header(){return `<div class="mx-auto w-full max-w-[1180px] px-3 pt-4 sm:px-5"><section class="card overflow-hidden"><div class="flex items-center gap-3 px-4 py-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-beauty-soft text-beauty-accent-strong">${icon('map','h-5 w-5')}</span><div><p class="font-beauty-display text-[17px] font-bold tracking-[-.045em]">Карты</p><p class="mt-0.5 text-[10px] text-beauty-muted">Салон «Ирис» · Яндекс Карты и 2ГИС</p></div></div><nav class="flex overflow-x-auto border-t border-black/10 px-2" aria-label="Контент"><button class="tab ${state.tab==='overview'?'is-active':''}" data-tab="overview" type="button">Обзор</button><button class="tab ${state.tab==='drafts'?'is-active':''}" data-tab="drafts" type="button">Черновики <span class="ml-1 rounded-full bg-beauty-warning-soft px-1.5 py-0.5 text-[8px] text-beauty-warning">2</span></button><button class="tab ${state.tab==='stories'?'is-active':''}" data-tab="stories" type="button">Истории</button><button class="tab ${state.tab==='news'?'is-active':''}" data-tab="news" type="button">Новости</button></nav></section></div>`}
    function suggestionCard(){const idea=recommendations[state.recommendation];return `<article class="card border-beauty-accent-soft bg-[#fffaf6] p-4"><div class="flex flex-wrap items-start justify-between gap-4"><div class="max-w-[660px]"><p class="text-[9px] font-extrabold uppercase tracking-[.1em] text-beauty-accent-strong">AI-помощник</p><h2 class="mt-1 font-beauty-display text-[18px] font-bold tracking-[-.04em]">${idea.title}</h2><p class="mt-2 text-[11px] leading-relaxed text-beauty-muted">${idea.body}</p></div><div class="flex shrink-0 flex-wrap gap-2"><button class="${primary}" data-recommend-create type="button">Создать публикацию ${icon('arrow','h-3.5 w-3.5')}</button><button class="${secondary}" data-recommend-other type="button">Другой вариант</button></div></div></article>`}
    function goalCards(){return `<section><div><h2 class="font-beauty-display text-[19px] font-bold tracking-[-.045em]">Что сегодня публикуем?</h2><p class="mt-1 text-[11px] text-beauty-muted">Выберите цель — AI подготовит остальное</p></div><div class="mt-3 grid gap-3 sm:grid-cols-2 xl:grid-cols-3">${Object.entries(goals).map(([id,goal])=>`<button class="goal-card card p-4 text-left" data-goal="${id}" type="button"><i class="grid h-9 w-9 place-items-center rounded-xl bg-beauty-soft font-beauty-display text-[17px] text-beauty-accent-strong">${goal.icon}</i><b class="mt-5 block text-[12px]">${goal.title}</b><span class="mt-1.5 block text-[9px] leading-relaxed text-beauty-muted">${goal.note}</span></button>`).join('')}</div></section>`}
    function draftRow(item){const published=item.status==='Опубликовано';return `<article class="grid grid-cols-[48px_minmax(0,1fr)_auto] items-center gap-3 border-t border-black/10 px-3 py-3"><div class="h-12 overflow-hidden rounded-[10px] ${item.type==='История'?'preview-image is-work':'bg-[#d7c2b0]'}"></div><div class="min-w-0"><b class="block truncate text-[11px]">${item.title}</b><small class="mt-1 block text-[8px] text-beauty-muted">${item.type} · ${item.date}</small></div><div class="flex items-center gap-3"><span class="hidden rounded-full ${published?'bg-beauty-sage-soft text-[#587147]':'bg-beauty-warning-soft text-beauty-warning'} px-2 py-1 text-[8px] font-bold sm:inline">${item.status}</span><button class="text-[10px] font-bold text-beauty-accent-strong" ${published?'data-tab="news"':'data-continue="'+item.id+'"'} type="button">${published?'Посмотреть':'Продолжить'}</button></div></article>`}
    function recentDrafts(){return `<section class="card overflow-hidden"><div class="flex items-center justify-between px-3 py-3"><h2 class="text-[12px] font-bold">Недавние черновики</h2><button class="text-[10px] font-bold text-beauty-accent-strong" data-tab="drafts" type="button">Все</button></div>${state.drafts.slice(0,3).map(draftRow).join('')}</section>`}
    function overview(){return `<section class="mx-auto grid w-full max-w-[1180px] gap-5 px-3 pb-6 pt-5 sm:px-5"><div class="flex flex-wrap items-start justify-between gap-3"><div><h1 class="font-beauty-display text-[clamp(1.35rem,2.2vw,1.85rem)] font-bold tracking-[-.05em]">Контент</h1><p class="mt-1.5 text-[12px] text-beauty-muted">Создавайте истории и новости для карт вместе с AI</p></div><button class="${secondary}" data-self-create type="button">${icon('plus','h-3.5 w-3.5')} Создать самостоятельно</button></div>${suggestionCard()}${goalCards()}${recentDrafts()}</section>`}
    function listing(type){const title={drafts:'Черновики',stories:'Истории',news:'Новости'}[type];const list=type==='drafts'?state.drafts.filter(item=>item.status==='Черновик'):state.drafts.filter(item=>type==='stories'?item.type==='История':item.type==='Новость');return `<section class="mx-auto grid w-full max-w-[1180px] gap-4 px-3 pb-6 pt-5 sm:px-5"><div class="flex items-center justify-between"><h1 class="font-beauty-display text-[clamp(1.35rem,2.2vw,1.85rem)] font-bold tracking-[-.05em]">${title}</h1><button class="${primary}" data-self-create type="button">${icon('plus','h-3.5 w-3.5')} Создать</button></div><section class="card overflow-hidden">${list.length?list.map(draftRow).join(''):'<p class="p-5 text-[11px] text-beauty-muted">Здесь пока нет публикаций.</p>'}</section></section>`}
    function progress(){return `<div class="flex items-center gap-3 overflow-x-auto border-b border-black/10 px-4 py-3"><span class="progress-step ${state.step===1?'is-active':state.step>1?'is-done':''}"><b>${state.step>1?'✓':'1'}</b>Детали</span><span class="h-px w-6 bg-black/10"></span><span class="progress-step ${state.step===2?'is-active':state.step>2?'is-done':''}"><b>${state.step>2?'✓':'2'}</b>Готовый вариант</span><span class="h-px w-6 bg-black/10"></span><span class="progress-step ${state.step===3?'is-active':''}"><b>3</b>Публикация</span></div>`}
    function serviceChips({multiple=true}={}){const current=multiple?state.selectedServices:[state.selectedServices[0]];const items=state.showMore?services:services.slice(0,6);return `<div class="mt-2 flex flex-wrap gap-2">${items.map(service=>`<button class="chip ${current.includes(service)?'is-active':''}" data-service="${service}" data-multiple="${multiple}" type="button">${service}</button>`).join('')}${!state.showMore?'<button class="chip" data-show-more type="button">Показать ещё</button>':''}</div>`}
    function upload({large=false}={}){return `<label class="upload-zone mt-2 flex ${large?'min-h-[180px]':'min-h-[74px]'} cursor-pointer flex-col items-center justify-center gap-2 p-3 text-center"><span class="grid h-8 w-8 place-items-center rounded-lg bg-beauty-surface text-beauty-accent-strong">${icon('image','h-4 w-4')}</span><span><b class="block text-[10px]">${large?'Добавьте фото результата':'Добавить фото'}</b><small class="mt-1 block text-[8px] text-beauty-muted">${state.photos.length?`Выбрано: ${state.photos.map(file=>esc(file.name)).join(', ')}`:'Необязательно'}</small></span><input class="sr-only" id="photoInput" type="file" accept="image/*" multiple></label>`}
    function details(){const goal=state.goal;const body=goal==='slots'?`<label class="text-[11px] font-bold">Когда есть свободные окна?<div class="mt-2 flex flex-wrap gap-2">${['Сегодня','Завтра','На этой неделе','Выбрать дату'].map(value=>`<button class="chip ${state.period===value?'is-active':''}" data-period="${value}" type="button">${value}</button>`).join('')}</div>${state.period==='Выбрать дату'?`<input class="field mt-3" data-bind="date" type="date" value="${state.date}">`:''}</label><section><b class="text-[11px]">На что хотим получить записи?</b><p class="mt-1 text-[9px] text-beauty-muted">Можно выбрать несколько услуг</p>${serviceChips()}</section><label class="text-[11px] font-bold">Что важно упомянуть?<textarea class="field mt-2 min-h-[100px] resize-y" data-bind="note" placeholder="Например: у мастера Анны есть места после 16:00">${esc(state.note)}</textarea></label>${upload()}`:goal==='service'?`<section><b class="text-[11px]">Какую услугу продвигаем?</b>${serviceChips({multiple:false})}</section><section><b class="text-[11px]">На чём сделать акцент?</b><div class="mt-2 flex flex-wrap gap-2">${['Рассказать об услуге','Показать преимущества','Рассказать о цене','Привлечь новых клиентов'].map(value=>`<button class="chip ${state.accent===value?'is-active':''}" data-accent="${value}" type="button">${value}</button>`).join('')}</div></section><label class="text-[11px] font-bold">Что ещё важно знать?<textarea class="field mt-2 min-h-[100px] resize-y" data-bind="note" placeholder="Например: у мастера Анны большой опыт работы с блондом">${esc(state.note)}</textarea></label>${upload()}`:goal==='work'?`<section><b class="text-[11px]">Какая это услуга?</b>${serviceChips({multiple:false})}</section><section><b class="text-[11px]">Добавьте фото результата</b>${upload({large:true})}</section><label class="text-[11px] font-bold">Что важно знать об этой работе?<textarea class="field mt-2 min-h-[100px] resize-y" data-bind="note" placeholder="Например: сложное окрашивани black/10 bg-beauty-surface'}" data-template="${item.id}" type="button"><i class="mb-1 block h-5 rounded ${item.id==='editorial'?'bg-gradient-to-t from-black/65 to-beauty-soft':item.id==='helpful'?'bg-beauty-sage-soft':'bg-beauty-accent-soft'}"></i><b class="block text-[8px] leading-tight">${item.title}</b><span class="mt-1 block text-[7px] leading-tight text-beauty-muted">${item.note}</span></button>`).join('')}</div></div><div class="rounded-xl bg-beauty-soft p-3"><div class="flex flex-wrap items-center justify-between gap-2"><div><b class="block text-[10px]">Изображение</b><span class="mt-1 block text-[8px] text-beauty-muted">AI подготовил вариант ${pending.imageVariant+1}. Текст на фото не закреплён.</span></div><button class="text-[9px] font-bold text-beauty-accent-strong" data-regenerate-image type="button">Другой вариант</button></div><div class="mt-3 flex flex-wrap gap-2"><button class="chip" data-image-fix="light" type="button">Сделать светлее</button><button class="chip" data-image-fix="focus" type="button">Сместить фокус</button></div></div><button class="${primary} justify-self-start" data-apply-preview type="button">Применить к предпросмотру</button></form><div class="mt-4"><p class="text-[9px] font-bold text-beauty-muted">Или попросите AI изменить вариант</p><div class="mt-2 flex flex-wrap gap-2">${['Сделать короче','Более живо','Добавить про цену','Другой заголовок','Убрать эмодзи','Другой вариант'].map(action=>`<button class="chip" data-quick="${action}" type="button">${action}</button>`).join('')}</div></div><form class="mt-4 grid gap-2 rounded-xl bg-beauty-soft p-3" id="changeForm"><label class="text-[10px] font-bold">Что изменить?<input class="field mt-1.5" name="change" placeholder="Например: добавь про скидку 10% для новых клиентов"></label><button class="${secondary} justify-self-end" type="submit">Подготовить правку</button></form><details class="mt-4 rounded-xl border border-black/10 p-3"><summary class="cursor-pointer text-[10px] font-bold">Дополнительные настройки</summary><p class="mt-2 text-[9px] text-beauty-muted">AI уже подобрал настройки. При необходимости их можно уточнить.</p><div class="mt-3 grid gap-2 sm:grid-cols-2"><label class="text-[9px] font-bold">CTA<select class="field mt-1"><option>Рекомендован AI</option><option>Записаться</option><option>Узнать подробнее</option></select></label><label class="text-[9px] font-bold">Тональность<select class="field mt-1"><option>Тёплая и дружелюбная</option><option>Деловая</option><option>Лёгкая</option></select></label></div></details><div class="mt-4 flex flex-wrap justify-between gap-2 border-t border-black/10 pt-4"><button class="${secondary}" data-save-draft type="button">Сохранить в черновики</button><button class="${primary}" data-next-publish type="button">Сохранить материал ${icon('arrow','h-3.5 w-3.5')}</button></div></section>${preview()}</div></section>`};
    state.editingReview=false;
    render();
  </script>
</body>
